plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Avoid duplicate Kotlin stdlib classes (Kotlin 1.8+).
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

// -PusePrebuiltLibs=true packages prebuilt jniLibs (CI); otherwise build via CMake.
def prebuilt = project.hasProperty('usePrebuiltLibs') && project.usePrebuiltLibs.toBoolean()

// Version from git, mirroring archlinux/PKGBUILD's pkgver(); fall back to 0.1/1 without git or tags.
def gitVersionName = {
    try {
        // providers.exec: plain exec is rejected at configuration time by Gradle 9's configuration cache.
        def text = providers.exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=12'
        }.standardOutput.asText.get().trim()
        return text.replaceFirst(/^v/, '').replace('-', '.')
    } catch (Exception ignored) {
        return '0.1'
    }
}()

def gitVersionCode = {
    try {
        def text = providers.exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
        }.standardOutput.asText.get().trim()
        return text.toInteger()
    } catch (Exception ignored) {
        return 1
    }
}()

android {
    namespace 'io.github.wszqkzqk.pvzportable'
    compileSdk 34
    buildToolsVersion "34.0.0"
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "io.github.wszqkzqk.pvzportable"
        minSdk 24
        targetSdk 34
        versionCode gitVersionCode
        versionName gitVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }

        if (!prebuilt) {
            externalNativeBuild {
                cmake {
                    def args = ["-DCMAKE_BUILD_TYPE=Release"]
                    if (project.hasProperty('cmakeArgs')) {
                        args.addAll(project.cmakeArgs.split(','))
                    }
                    arguments(*args)
                }
            }
        }
    }

    signingConfigs {
        release {
            // Keystore is injected via env vars by CI; absent (e.g. local builds) falls back to debug signing.
            def storeFilePath = System.getenv('PVZP_KEYSTORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv('PVZP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PVZP_KEY_ALIAS')
                keyPassword System.getenv('PVZP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('PVZP_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    if (!prebuilt) {
        externalNativeBuild {
            cmake {
                path "../../CMakeLists.txt"
                version "3.22.1+"
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                "${project.rootDir}/../sdl2-src/android-project/app/src/main/java"
            ]
            // CMake builds both native libraries. Keep checked-in JNI blobs
            // available only for the explicit prebuilt-libraries workflow.
            jniLibs.srcDirs = prebuilt ? ['src/main/jniLibs'] : []
        }
    }

    buildFeatures {
        prefab true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    lint {
        abortOnError false
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation platform('androidx.compose:compose-bom:2024.02.02')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
}
